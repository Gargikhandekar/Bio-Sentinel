services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./config:/app/config
  web:
    image: node:20
    working_dir: /ui
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/ui
    depends_on:
      - api
